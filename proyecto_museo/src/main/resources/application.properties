
quarkus.application.name=proyecto_museo
quarkus.http.port=8080

# ------------------------------------------------------------
# BASE DE DATOS (MySQL / MariaDB de XAMPP) -> debe estar encendido
# createDatabaseIfNotExist=true: si la base "proyecto_museo" no existe, se crea sola.
# Nota: Si tu MySQL corre en el puerto 3307 (como en XAMPP a veces), cambia 3306 por 3307.
# ------------------------------------------------------------
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/proyecto_museo?createDatabaseIfNotExist=true

# ------------------------------------------------------------
# JPA / HIBERNATE
# update: crea las tablas que falten y actualiza su estructura (desde las @Entity).
# ------------------------------------------------------------
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.database.version-check.enabled=false
quarkus.hibernate-orm.log.sql=true

# ------------------------------------------------------------
# CORS (Permite conectar las vistas desde cualquier origen, Live Server o archivo local)
# ------------------------------------------------------------
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS